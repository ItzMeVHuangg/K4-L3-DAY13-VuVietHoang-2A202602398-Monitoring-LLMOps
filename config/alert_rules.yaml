alerts:
  - name: high_tail_latency
    severity: critical
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack#day13-l3a-oncall
    owner: on-call-engineer
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: warning
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack#day13-l3a-oncall
    owner: platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: quality_or_retrieval_degradation
    severity: warning
    condition: quality_score_avg < 0.75 or retrieval_success_rate_pct < 90
    duration: 15m
    type: symptom-based
    channel: slack#day13-l3a-oncall
    owner: ml-oncall
    runbook: docs/alerts.md#alert-3
